name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: 设置国内镜像
        run: |
          echo "PUB_HOSTED_URL=https://pub.flutter-io.cn" >> $GITHUB_ENV
          echo "FLUTTER_STORAGE_BASE_URL=https://storage.flutter-io.cn" >> $GITHUB_ENV

      - name: 生成 Android 脚手架（不覆盖现有代码）
        run: |
          flutter create --project-name time_tracker --org com.timetracker --platforms android _scaffold
          mv _scaffold/android ./android
          rm -rf _scaffold

      - name: 安装依赖
        run: flutter pub get

      - name: 编译 APK
        run: flutter build apk --release

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: time-tracker-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
